name: Check 拾焰

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /yxl-todo/
      - run: npm run build:single
      - name: Check committed portable file
        run: git diff --exit-code -- shiyan.html

      - run: python -m pip install -r scripts/browser-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:browser
