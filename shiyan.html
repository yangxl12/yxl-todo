mo,value:r.prefs.goalSort,onChange:W=>d({type:"prefs/update",patch:{goalSort:W}})}),u.jsx(Py,{label:"新增目标",onClick:ce})]})}const Zp=[{id:"method-mental-contrasting",kind:"method",theme:"启动",title:"想过好结果，再找最可能卡住你的事",summary:"想象做成后的好处，再看看现在最可能被什么绊住。找到这个障碍，计划才知道该防什么。",practice:"写下一个近期愿望、实现后的好处、最可能遇到的一个障碍。接着补一句：“如果遇到它，我就先做什么？”",evidence:"2021 年一项纳入 21 项研究的元分析发现，把心理对照和执行意图结合起来，对目标达成平均有小到中等的帮助。研究间效果有差异，也存在发表偏倚的可能。",citation:"Wang et al. (2021). Frontiers in Psychology, 12, 565202.",sourceUrl:"https://doi.org/10.3389/fpsyg.2021.565202"},{id:"method-approach-goals",kind:"method",theme:"启动",title:"把「少做什么」改成「要做什么」",summary:"“少刷视频”给你划了一条线。“睡前在沙发上读两页”给你安排了线的另一边。",practice:"挑一个带“少”“别”或“不要”的目标，改写成你愿意用来替代它的动作。写清下次在哪儿做。",evidence:"在一项新年目标研究中，以想采取的行为来表述目标的人，一年后自报成功率高于以回避行为来表述的人。研究没有随机分配目标措辞，这个差异只是关联。",citation:"Oscarsson et al. (2020). PLOS ONE, 15(12), e0234097.",sourceUrl:"https://doi.org/10.1371/journal.pone.0234097"},{id:"method-autonomous-motives",kind:"method",theme:"启动",title:"找一句你自己认同的理由",summary:"同一件事可能既有外部要求，也有你在乎的部分。后者可以帮你决定今天值得把力气花在哪儿。",practice:"挑一个一直在拖的目标，补完“即使没人知道，我也愿意做它的一部分，因为……”。如果写不出来，试着改一下目标本身。",evidence:"目标动机元分析发现，出于兴趣或个人认同追求目标，与更顺利的目标调节和较高的幸福感有关。多数证据是关联，不能用来预测某个人一定能坚持。",citation:"Sezer et al. (2025). Motivation Science, 11, 259–276.",sourceUrl:"https://eprints.soton.ac.uk/493985/"},{id:"method-procrastination-log",kind:"method",theme:"启动",title:"记一次拖延发生前的那几秒",summary:"同样是没动手，可能是任务不清楚、担心做砸，也可能只是累了。先认出这一次的原因，才好下手。",practice:"下次绕开一个任务时记三行：“原本要做什么”“当时冒出什么想法”“转去做了什么”。找出其中一个下次可以改变的环节。",evidence:"GetStarted 随机试验发现，含拖延记录、认知练习和教练指导的线上课程能降低大学生的短期拖延评分。记录是课程的一部分，研究没有单独测量记录的效果。",citation:"Amarnath et al. (2025). Internet Interventions, 42, 100878.",sourceUrl:"https://doi.org/10.1016/j.invent.2025.100878"},{id:"method-timed-reminder",kind:"method",theme:"启动",title:"把提醒放在能够行动的时候",summary:"“记得交材料”会在一天里反复占位置。把提醒设在电脑在手、材料齐备的时间，你就有机会当场做完。",practice:"为一件容易忘的小事设一次提醒。标题写成可以直接执行的动作，例如“把签好的表发给小林”。",evidence:"Tsai 与 Gilbert 的实验显示，外部提醒有助于完成稍后要做的事。研究使用定时记忆任务，实践中的提醒时机还要考虑你什么时候能动手。",citation:"Tsai & Gilbert (2025). Memory & Cognition, 53, 2237–2254.",sourceUrl:"https://doi.org/10.3758/s13421-025-01708-x"},{id:"method-start-with-discomfort",kind:"method",theme:"启动",title:"带着一点不情愿，先做一步",summary:"打开难写的文档时，你可以还觉得难受。把“想不想做”先放在一边，看手上能不能完成一小步。",practice:"给自己五分钟，允许紧张或厌烦还在。只做一件可以停下的小事，例如给空文档写一个临时标题和三个要点。",evidence:"2026 年 CONCRAS 随机试验中，包含接纳不适和价值导向行动的单次干预，让大学生在短期内报告较少拖延。结果支持整套干预，五分钟是这里的试用安排。",citation:"CONCRAS 随机对照试验 (2026). Psychotherapy and Psychosomatics.",sourceUrl:"https://doi.org/10.1159/pps/aemag001"},{id:"method-interleaved-discrimination",kind:"method",theme:"专注",title:"把容易弄混的题放在一起练",summary:"同一类题连做五道，你早就知道该用哪一招。混着练会多出一道选择题：我为什么用这一招？",practice:"选两三类已经学过、容易混淆的题，去掉题型标签后混着做。动笔前先指出一道题让你选这个解法的线索。",evidence:"2026 年真实课堂元分析发现，交错练习平均有小到中等的收益。交错练习结论来自 10 项研究，反馈有没有给、何时给，会影响效果。",citation:"Ruitenburg et al. (2026). Educational Psychology Review, 38, 137.",sourceUrl:"https://doi.org/10.1007/s10648-026-10225-5"},{id:"method-worked-example",kind:"method",theme:"专注",title:"遇到陌生题型，先看一遍完整解法",summary:"一份完整例题让你看见高手途中做了哪些选择。读完趁热独立做一道，试试哪些步骤还接不上。",practice:"拿一道有分步答案的例题，把过程从头看到尾。盖住例题做一道同类题，卡住时只回看那一步。",evidence:"数学学习元分析汇总了 55 项研究，发现完整例题对数学表现平均有中等帮助。正确例题的结果更稳，研究范围主要是数学。",citation:"Barbieri et al. (2023). Educational Psychology Review, 35, 11.",sourceUrl:"https://doi.org/10.1007/s10648-023-09745-1"},{id:"method-explain-with-diagram",kind:"method",theme:"专注",title:"对着一张图，给没学过的人讲一遍",summary:"讲清一个系统怎么转起来，要跨过部件之间的那一步。顺着图讲，比较容易听出哪里还含糊。",practice:"找出资料里一张关键流程图。指着它讲 90 秒，说清每条箭头是什么意思。把讲不通的一段标下来再查。",evidence:"Fiorella 在学习后讲解的实验中发现，图示在部分条件下有帮助，教师提供的图示比学习者自行绘图表现更稳。这类结果来自可用图示表达的知识。",citation:"Fiorella (2023). Applied Cognitive Psychology, 37, 1124–1138.",sourceUrl:"https://doi.org/10.1002/acp.4100"},{id:"method-prequestions",kind:"method",theme:"专注",title:"学新内容之前，先猜一个答案",summary:"带着一个具体问题去读，你会更容易留意解答。猜错也有用，只要读完回过头核对。",practice:"打开新一章前，把一个小标题改成问题，写下你猜的答案。读到相关段落时，当场改掉猜错的地方。",evidence:"预提问元分析发现，学习前答题的收益主要出现在被提前问到的知识上。对同一份材料里没被问到的内容，平均迁移效果很小。",citation:"St. Hilaire et al. (2024). Psychonomic Bulletin & Review, 31, 411–441.",sourceUrl:"https://doi.org/10.3758/s13423-023-02353-8"},{id:"method-process-feedback",kind:"method",theme:"专注",title:"做错一道题，找出第一次走偏的地方",summary:"一个红叉只能告诉你结果。找到推理从哪一步开始不成立，下一道题才有东西可改。",practice:"挑一个刚完成的练习。把自己的过程与可靠解析对照，圈出第一处不同。改正后再独立做一道同类题。",evidence:"对 116 项数字教学反馈干预的元分析发现，反馈平均有利于学习。反馈关注的层次、学科和任务类型都能解释部分差异，过程反馈尤其值得关注。",citation:"Brummer et al. (2024). Learning Environments Research, 27, 453–476.",sourceUrl:"https://doi.org/10.1007/s10984-024-09501-4"},{id:"method-ai-hints",kind:"method",theme:"专注",title:"用 AI 学习时，只要提示，留一道题自己做",summary:"借助答案做完题的顺畅感，很容易和独立掌握混在一起。用一道关掉 AI 也能做的题来检验。",practice:"把你的已有思路给 AI，要求它每次只给一个提示。结束后关掉对话，独立完成一道同类题，并核对答案。",evidence:"高中数学实地随机试验中，通用 AI 提高了有工具时的练习表现，但撤掉工具后该组表现下降。带教学限制的 AI 导师大幅缓解了这种下降。研究测试的是特定系统与课程。",citation:"Bastani et al. (2025). PNAS, 122, e2422633122.",sourceUrl:"https://doi.org/10.1073/pnas.2422633122"},{id:"method-mobile-internet-block",kind:"method",theme:"专注",title:"给最难的一段工作留个断网时段",summary:"随时能打开的信息流，会给每一次卡顿一个出口。把入口暂时关上，给正在做的事一点缓冲。",practice:"挑一个不依赖手机联网的工作时段。提前备好资料，给家人或同事保留电话联络，用完再恢复网络。",evidence:"2025 年一项随机试验让参与者阻断手机互联网两周，电话和短信仍可用。干预改善了客观测得的持续注意表现，但实际遵守率有限，单个短时段的效果没有在该研究中验证。",citation:"Castelo et al. (2025). PNAS Nexus, 4(2), pgaf017.",sourceUrl:"https://doi.org/10.1093/pnasnexus/pgaf017"},{id:"method-app-entry-pause",kind:"method",theme:"专注",title:"在随手点开的应用前加一道停顿",summary:"有时候手点开了应用，你才发现自己没有要看的东西。给这一步留出一次反悔的机会。",practice:"给最容易下意识点开的应用设置一道可取消的延迟或确认。弹出时问“我具体来做什么？”，答不上来就关掉。",evidence:"one sec 研究中的实地观察和配套在线实验显示，延迟和显式取消选项可以减少部分冲动打开。实地部分为自选用户，且应用开发者参与了研究。",citation:"Grüning et al. (2023). PNAS, 120(8), e2213114120.",sourceUrl:"https://doi.org/10.1073/pnas.2213114120"},{id:"method-contrast-errors",kind:"method",theme:"专注",title:"学一条规则，同时看一个成立的例子和一个反例",summary:"两个例子看起来几乎一样时，分界处往往藏着规则的适用条件。知道什么情况不能套用，才能在新题里认出来。",practice:"找一对标明对错的相似示例，圈出让结论发生变化的条件。补完一句“这种做法只在……时成立”。",evidence:"2025 年系统综述汇总了 40 项研究。对照正误例子在一些条件下能促进学习，收益受错误有没有被突出、提示是否清楚和学习者已有知识影响。",citation:"Dieterich et al. (2025). Educational Psychology Review, 37, 94.",sourceUrl:"https://doi.org/10.1007/s10648-025-10071-x"},{id:"method-routine-anchor",kind:"method",theme:"坚持",title:"把新习惯接在一个本来就会做的动作后面",summary:"如果每天吃完午饭的时间有出入，“收完餐具就出门”依然能用。习惯可以跟着生活里的顺序走。",practice:"给一个新习惯找个已经稳定发生的前一步，例如“收好午餐餐具后就走一小圈”。接下来的几次尽量照这个顺序来。",evidence:"中年成年人步行随机试验发现，在一致情境下计划步行，更有利于形成步行自动性。两种计划组都能增加步数，情境稳定带来的优势主要体现在自动性。",citation:"Ebert & Lin (2024). Annals of Behavioral Medicine, 58, 741–751.",sourceUrl:"https://doi.org/10.1093/abm/kaae045"},{id:"method-flexible-window",kind:"method",theme:"坚持",title:"给常规安排留一个补位时间",summary:"固定的出发时间省心，生活里也总有临时加班或下雨。提前想好另一个可行时段，少一次临场重排。",practice:"找一项容易因日程中断的活动。看看本周哪两个时段都能做，先安排首选，再给自己留一个备用。",evidence:"员工健身现场实验中，奖励任意时段锻炼，比只奖励固定两小时窗口，更能维持奖励结束后的到访。研究比较的是奖励规则，具体安排可以当成小试验。",citation:"Beshears et al. (2021). Management Science, 67, 4139–4171.",sourceUrl:"https://doi.org/10.1287/mnsc.2020.3706"},{id:"method-reward-comeback",kind:"method",theme:"坚持",title:"把小奖励留给中断后的第一次回来",summary:"断过一次之后，再出发常比第一天难。把“我又回来了一次”当成值得单独庆祝的事。",practice:"给一个容易中断的习惯留个轻松的回归仪式。例如这次错过练习，下一次练完就去买一杯喜欢的茶。",evidence:"一项比较 54 种健身干预的大型实地随机试验发现，效果最好的方案为错过一次后返回健身房提供小额奖励。研究观察的是健身到访，自选奖励是日常改编。",citation:"Milkman et al. (2021). Nature, 600, 478–483.",sourceUrl:"https://doi.org/10.1038/s41586-021-04128-4"},{id:"method-step-baseline",kind:"method",theme:"坚持",title:"想多走一点，先看自己平常走多少",summary:"知道自己的日常水平，就能看出哪一天最适合加一小段路，也能判断这次调整有没有落到实处。",practice:"用手机已有的计步功能看最近一周，选一个方便多走一小段的日子。下周对比同一天，顺手记下天气和行程。",evidence:"社区成人随机试验的元分析发现，包含计步监测的干预平均能增加短期步数，效果随随访时间减弱。研究中的方案不总只有计步。",citation:"Chaudhry et al. (2020). International Journal of Behavioral Nutrition and Physical Activity, 17, 129.",sourceUrl:"https://doi.org/10.1186/s12966-020-01020-8"},{id:"method-personal-activity-target",kind:"method",theme:"坚持",title:"给自己选一个能从今天开始的活动量",summary:"每天真的走得了多少，往往比别人给的标准更适合当起点。先选一个你愿意马上开始的量。",practice:"用自己最近的活动量作参考，定下本周能做到、又多一点的目标。找一段熟悉又方便的路线，今天就走第一次。",evidence:"ENGAGE 随机试验把活动目标的选择权和启动节奏分开比较。对心血管风险较高的成人，在同一套游戏化方案中，自选目标并立即开始的组合相较对照增加了活动量。",citation:"Patel et al. (2021). JAMA Cardiology, 6, 1387–1396.",sourceUrl:"https://doi.org/10.1001/jamacardio.2021.3176"},{id:"method-test-small-environment-change",kind:"method",theme:"坚持",title:"给旧习惯换一条日常路线",summary:"有些行为总跟在同一个地点、动作或时段后面。试着切断其中一个熟悉的前奏，给别的选择留位置。",practice:"找出一件常常自动发生的事和它的前一个动作。只换这一个环节，例如下班先走到楼下买菜，再回家坐下。",evidence:"Wood 的综述区分了个人目标与由环境线索触发的习惯。打断旧线索和调整行为难度是综述讨论的改变路径，具体效果取决于原来触发行为的是什么。",citation:"Wood (2024). Current Directions in Psychological Science, 33, 226–232.",sourceUrl:"https://doi.org/10.1177/09637214241246480"},{id:"method-nature-walk",kind:"method",theme:"恢复",title:"有得选时，把散步路线走进绿地",summary:"忙了一阵想出门透气，可以选一条有树有草的路，沿途留意你看到和听到的变化。",practice:"挑一段安全方便的绿地路线，找个有空的时段走一走。回来只问一个问题：我现在回到手头事的感觉怎样？",evidence:"随机试验比较了绿地与城市环境中约 40 分钟的步行。绿地组在一项反映执行注意的脑电指标上改善更明显；这项研究没有证明所有注意指标都变好。",citation:"McDonnell & Strayer (2024). Scientific Reports, 14, 1845.",sourceUrl:"https://doi.org/10.1038/s41598-024-52205-1"},{id:"method-unhurried-exhale",kind:"method",theme:"恢复",title:"腾几分钟，让呼气慢下来",summary:"从忙碌切到休息时，可以给身体一个容易执行的动作。坐稳，吸气自然一点，呼气从容一点。",practice:"找个能安心坐着的地方，试几轮舒适的慢呼气。保持自然力度，觉得头晕或不舒服就停下。",evidence:"随机试验比较了持续一个月、每日五分钟的呼吸练习与正念冥想。以呼气为重点的一组在积极情绪和呼吸频率上的变化较明显。这里是简化练习，未复刻试验流程。",citation:"Balban et al. (2023). Cell Reports Medicine, 4(1), 100895.",sourceUrl:"https://doi.org/10.1016/j.xcrm.2022.100895"},{id:"method-sleep-regularity",kind:"method",theme:"恢复",title:"给起床时间留一个相对稳定的范围",summary:"给作息留点弹性，也给一天一个容易认得的开头。先看哪种起床安排能兼顾你的日程和睡眠时长。",practice:"按上班、上课或照护安排选一个平常能做到的起床区间，一周里尽量接近。也给就寝留出够睡的时间。",evidence:"睡眠规律性系统综述发现，睡眠时间不稳定与多种较差的健康结局相关。证据以观察研究为主，无法从中确定人人适用的起床区间。",citation:"Kalkanis et al. (2025). Sleep Medicine Reviews, 84, 102203.",sourceUrl:"https://doi.org/10.1016/j.smrv.2025.102203"},{id:"method-after-work-detachment",kind:"method",theme:"恢复",title:"给下班后的第一段时间换一个活动",summary:"人下班了，脑子可能还在工作群里。提前想好一件你愿意投入的工作之外的事，给注意力一个去处。",practice:"挑一个今天做得到的下班活动，例如散步、做饭或给朋友打电话。安排一个可以暂时把工作消息留到之后的时段。",evidence:"工作心理脱离干预的元分析发现，干预平均能帮助人减少工作之外对工作的持续牵挂。纳入的干预形式各异，具体下班活动是可试用的安排。",citation:"Karabinski et al. (2021). Journal of Occupational Health Psychology, 26, 224–242.",sourceUrl:"https://pubmed.ncbi.nlm.nih.gov/34096763/"},{id:"method-distanced-reflection",kind:"method",theme:"恢复",title:"用旁观者的口吻讲一遍发生了什么",summary:"反复回想同一幕时，可以换个叙述角度。把人物、事情和感受分开，也许能看见当时忽略的线索。",practice:"挑一件轻度烦心的小事，用自己的名字写三句：“发生了什么”“当时在乎什么”“接下来能做什么”。",evidence:"25 项成人实验的元分析发现，拉开心理距离来反思，相较于沉浸式回想，在情绪和认知等测量上平均有小幅优势。研究结论受情境和反思形式影响。",citation:"Murdoch et al. (2023). Stress and Health, 39, 255–271.",sourceUrl:"https://doi.org/10.1002/smi.3199"},{id:"method-small-kind-act",kind:"method",theme:"恢复",title:"做一件对别人有用、自己也承担得起的事",summary:"在一切都不好掌控的时候，还可以把心力用到一个看得见的地方。选一件对方确实需要的小事。",practice:"给一个人发句具体的感谢，或者替对方省掉一项小麻烦。做之前想想对方是否需要，自己今天是否有余力。",evidence:"一项为期两周的社区实验发现，在完成试验的参与者中，为别人做善意小事的一组比对照组报告更少的孤独感。试验在疫情期间开展，测的是重复实践的短期效果。",citation:"Exploring the effects of prosocial and self-kindness interventions on mental health outcomes (2025 年在线发表). Emotion.",sourceUrl:"https://doi.org/10.1037/emo0001577"},{id:"method-structured-debrief",kind:"method",theme:"回望",title:"复盘时，把原计划和实际结果放一起",summary:"只写“下次更努力”往往帮不上下一次。比一比原计划和事实，你才能决定要改哪一处。",practice:"用四句复盘刚做完的一件事：“原以为会怎样”“实际怎样”“什么造成差别”“下次试一个什么改动”。",evidence:"行动后复盘元分析发现，结构化复盘平均能改善任务表现。复盘方式需要与个人或团队的任务匹配，使用贴近真实表现的材料有助于复盘。",citation:"Keiser & Arthur (2021). Journal of Applied Psychology, 106, 1007–1032.",sourceUrl:"https://doi.org/10.1037/apl0000821"},{id:"method-future-advice",kind:"method",theme:"回望",title:"请人给下一版一个建议",summary:"“你觉得怎么样？”很容易收到“还行”。把问题放到未来，对方更容易指出你现在能改的一处。",practice:"把工作或作品发给懂这件事的人，问：“如果下一版我只能动一个地方，你建议改哪儿？你会怎么着手？”",evidence:"一项预注册实地实验和两项实验室研究发现，请对方提供建议，比请对方提供反馈，更能得到具体且可采取行动的意见。后续独立评分者也认为更具体的意见更有用。",citation:"Blunden et al. (2026). Management Science, 72(3), 2247–2266.",sourceUrl:"https://doi.org/10.1287/mnsc.2022.03207"},{id:"method-goal-reengagement",kind:"method",theme:"回望",title:"原目标走不通时，保留在乎的那部分",summary:"一个项目停下来，背后的愿望还在。先分清你怀念的是原来的方案，还是它原本能带来的东西。",practice:"挑一个反复卡住的目标，写下它本来服务的价值。列一个成本更低、能照顾同一价值的目标，并做一个小动作。",evidence:"目标调整元分析区分了放下原目标、投入新目标和灵活调整。重新投入与部分较好的幸福感指标有关，结果有异质性且大量证据是观察性的。",citation:"Riddell et al. (2026). Nature Human Behaviour, 10, 317–332.",sourceUrl:"https://doi.org/10.1038/s41562-025-02312-4"},{id:"method-specific-gratitude",kind:"method",theme:"回望",title:"记一个今天确实帮到你的细节",summary:"平常的一天也可能有人给过你方便，或者某件事比想象中顺利。把那一刻写具体，留作回头时能认出来的证据。",practice:"用一句话写下谁做了什么，或什么条件帮到了你，再写它实际省掉了哪一点麻烦。日子难过时，可以只记录事实。",evidence:"涵盖 28 国、145 篇论文的元分析发现，感恩练习平均带来小幅幸福感提升。国家和练习设计之间存在差异，这个动作适合在你愿意时尝试。",citation:"Choi et al. (2025). PNAS, 122, e2425193122.",sourceUrl:"https://doi.org/10.1073/pnas.2425193122"},{id:"method-creative-incubation",kind:"method",theme:"回望",title:"把半成品放一放，再回来写第二版",summary:"一段文字写不下去时，先把现有版本留住。做件不用一直费脑的事，再回来看看是否有别的写法。",practice:"保存一个初稿，给自己留下一个待解的问题。做一阵熟悉的家务，回来先写另一种开头，最后再比较两个版本。",evidence:"2025 年创意写作实验中，休息期间更多的思绪游走与重写同一提示时更高的创造性提升相关。各休息条件之间没有稳定的创造性差异，过程关联也不等于因果。",citation:"McDaniel et al. (2025). Scientific Reports, 15, 24629.",sourceUrl:"https://doi.org/10.1038/s41598-025-09736-y"}],Ty={启动:[["heaven-in-motion","自强不息","天行健，君子以自强不息。","《周易》","乾卦·象传","周易/乾"],["polish-the-jade","玉不琢，不成器","玉不琢，不成器；人不学，不知道。","《礼记》","《学记》","禮記/學記"],["prepare-to-begin","凡事先作准备","凡事豫则立，不豫则废。","《礼记》","《中庸》","禮記/中庸"],["know-where-to-stop","知止而后有定","知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。","《礼记》","《大学》","禮記/大學"],["act-on-what-is-right","认准了就行动","见义不为，无勇也。","孔子","《论语·为政》","論語/為政第二"],["one-basket-of-earth","从一筐土开始","譬如平地，虽覆一篑，进，吾往也。","孔子","《论语·子罕》","論語/子罕第九"],["haste-and-small-gains","欲速则不达","欲速则不达，见小利则大事不成。","孔子","《论语·子路》","論語/子路第十三"],["mozi-resolve","立定心志","志不强者智不达，言不信者行不果。","墨子","《修身》","墨子/修身"],["near-road","道虽迩，不行不至","道虽迩，不行不至；事虽小，不为不成。","荀子","《修身》","荀子/修身篇"],["weave-the-net","退而结网","临渊羡鱼，不如退而结网。","董仲舒引古语","《汉书·董仲舒传》","漢書/卷056"],["old-steed","老骥伏枥","老骥伏枥，志在千里；烈士暮年，壮心不已。","曹操","《龟虽寿》","龜雖壽"],["cloudward-ambition","青云之志","穷且益坚，不坠青云之志。","王勃","《滕王阁序》","滕王閣序"],["ride-the-wind","直挂云帆","长风破浪会有时，直挂云帆济沧海。","李白","《行路难》其一","行路難 (金樽清酒斗十千)"],["climb-tai","一览众山小","会当凌绝顶，一览众山小。","杜甫","《望岳》","望嶽 (岱宗夫如何)"],["roc-in-flight","风鹏正举","九万里风鹏正举。风休住，蓬舟吹取三山去！","李清照","《渔家傲·天接云涛连晓雾》","漁家傲 (李清照)"],["learn-by-doing","绝知此事要躬行","纸上得来终觉浅，绝知此事要 轼","《记承天寺夜游》","記承天寺夜遊"],["tracks-on-snow","雪泥鸿爪","人生到处知何似？应似飞鸿踏雪泥。","苏轼","《和子由渑池怀旧》","和子由澠池懷舊"],["frogs-among-rice","稻花香，蛙声一片","稻花香里说丰年，听取蛙声一片。","辛弃疾","《西江月·夜行黄沙道中》","西江月 (辛棄疾)"],["snow-and-company","晚来天欲雪","晚来天欲雪，能饮一杯无？","白居易","《问刘十九》","問劉十九"],["mountains-and-rivers","山水之乐","醉翁之意不在酒，在乎山水之间也。","欧阳修","《醉翁亭记》","醉翁亭記"],["joy-and-setbacks","不以物喜，不以己悲","不以物喜，不以己悲。","范仲淹","《岳阳楼记》","岳陽樓記"],["sunset-still-beautiful","夕阳无限好","夕阳无限好，只是近黄昏。","李商隐","《乐游原》","樂遊原_(向晚意不適)"],["lotus-and-dragonfly","小荷才露尖尖角","小荷才露尖尖角，早有蜻蜓立上头。","杨万里","《小池》","小池"],["spring-butterflies","留连戏蝶","留连戏蝶时时舞，自在娇莺恰恰啼。","杜甫","《江畔独步寻花》其六","江畔獨步尋花七絕句"],["ducks-know-spring","春江水暖鸭先知","竹外桃花三两枝，春江水暖鸭先知。","苏轼","《惠崇春江晚景》其一","惠崇春江晚景"],["drink-among-flowers","举杯邀明月","举杯邀明月，对影成三人。","李白","《月下独酌》其一","月下獨酌"]],回望:[["daily-examination","吾日三省吾身","吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？","曾子","《论语·学而》","論語/學而第一"],["learn-from-virtue","见贤思齐","见贤思齐焉，见不贤而内自省也。","孔子","《论语·里仁》","論語/里仁第四"],["know-what-you-know","知与不知","知之为知之，不知为不知，是知也。","孔子","《论语·为政》","論語/為政第二"],["repair-mistakes","过则改之","过而不改，是谓过矣。","孔子","《论语·卫灵公》","論語/衛靈公第十五"],["actions-match-words","言行相称","君子耻其言而过其行。","孔子","《论语·宪问》","論語/憲問第十四"],["what-is-mine-to-do","求诸己","君子求诸己，小人求诸人。","孔子","《论语·卫灵公》","論語/衛靈公第十五"],["look-into-your-action","反求诸己","行有不得者，皆反求诸己。","孟子","《离娄上》","孟子/離婁上"],["cultivate-and-contribute","独善其身，兼善天下","穷则独善其身，达则兼善天下。","孟子","《尽心上》","孟子/盡心上"],["read-with-judgment","尽信书，不如无书","尽信书，则不如无书。","孟子","《尽心下》","孟子/盡心下"],["well-and-sea","井蛙与大海","井蛙不可以语于海者，拘于墟也。","庄子","《秋水》","莊子/秋水"],["cut-and-polish","如切如磋","如切如磋，如琢如磨。","《诗经》","《卫风·淇奥》","詩經/淇奧"],["stone-polishes-jade","它山之石","它山之石，可以攻玉。","《诗经》","《小雅·鹤鸣》","詩經/鶴鳴"],["correcting-a-fault","过而能改","人谁无过？过而能改，善莫大焉。","士季","《左传·宣公二年》","春秋左氏傳/宣公"],["repair-the-fold","亡羊补牢","亡羊而补牢，未为迟也。","庄辛","《战国策·楚策四》","戰國策/卷17"],["past-and-future-view","后之视今","后之视今，亦犹今之视昔。","王羲之","《兰亭集序》","蘭亭集序"],["do-what-you-can","尽吾志而无悔","尽吾志也而不能至者，可以无悔矣。","王安石","《游褒禅山记》","遊褒禪山記"],["notice-small-failures","祸患积于忽微","夫祸患常积于忽微，而智勇多困于所溺。","欧阳修","《五代史伶官传序》","五代史伶官傳序"],["knowledge-begins-action","知与行","知是行之始，行是知之成。","王阳明","《传习录》上卷","傳習錄/卷上"],["snow-and-plum","梅与雪各有所长","梅须逊雪三分白，雪却输梅一段香。","卢梅坡","《雪梅》其一","雪梅_(盧梅坡)"],["spring-beyond-loss","病树前头万木春","沉舟侧畔千帆过，病树前头万木春。","刘禹锡","《酬乐天扬州初逢席上见赠》","酬樂天揚州初逢席上見贈"]]},Kp=Object.keys(Ty).flatMap(s=>Ty[s].map(([r,d,o,m,p,x])=>({id:`quote-${r}`,kind:"quote",theme:s,title:d,body:o,attribution:m,source:p,sourceUrl:x.startsWith("https://")?x:`https://zh.wikisource.org/zh-hans/${x.split("/").map(encodeURIComponent).join("/")}`}))),Xp=[{id:"method-if-then",kind:"method",theme:"启动",title:"把决心写成一句「如果……就……」",summary:"模糊的“我明天要运动”很容易被现场情绪击败。提前决定在什么时间、什么地点、做什么，会减少那一刻的犹豫。",evidence:"Gollwitzer 与 Sheeran 汇总 94 项独立研究发现，执行意图（if–then plan）对目标达成有稳定的中等偏大效果。比起只设定目标，它更像提前写好了启动顺序。",practice:"把今天最想推进的一件事写成：“如果到了 ___（时间/地点），我就先做 ___（最小动作）。”",citation:"Gollwitzer, P. M., & Sheeran, P. (2006). Implementation intentions and goal achievement: A meta-analysis of effects and processes. Advances in Experimental Social Psychology, 38, 69–119.",sourceUrl:"https://doi.org/10.1016/S0065-2601(06)38002-1",sourceLabel:"DOI"},{id:"method-specific-goal",kind:"method",theme:"启动",title:"「多读点书」不如「今晚读十页」",summary:"目标越具体、越有一点挑战，注意力越知道该落在哪里。含混的愿望，往往连第一步都无法开始。",evidence:"Locke 与 Latham 回顾数十年目标设置研究后指出，具体而有难度、并且能得到反馈的目标，通常比“尽力而为”带来更好的表现。",practice:"把正在做的一个目标，改成能看见完成条件的一句话；如果可能，只留下下一步。",citation:"Locke, E. A., & Latham, G. P. (2002). Building a practically useful theory of goal setting and task motivation: A 35-year odyssey. American Psychologist, 57(9), 705–717.",sourceUrl:"https://doi.org/10.1037/0003-066X.57.9.705",sourceLabel:"DOI"},{id:"method-attention-residue",kind:"method",theme:"专注",title:"切换之前，先给大脑一个停靠点",summary:"从一件事跳到另一件事时，没放下的那部分会继续占用注意力。这不是意志力差，而是切换本身有成本。",evidence:"Leroy（2009）的系列实验发现，从事需要认知投入的任务时，若上一件事没有形成清晰收尾，切换到新任务后的表现会受影响。",practice:"离开前用 60 秒写下：现在到哪了、下一步是什么、什么时候回来。然后再去开会、吃饭或休息。",citation:"Leroy, S. (2009). Why is it so hard to do my work? The challenge of attention residue when switching between work tasks. Organizational Behavior and Human Decision Processes, 109(2), 168–181.",sourceUrl:"https://doi.org/10.1016/j.obhdp.2009.04.002",sourceLabel:"DOI"},{id:"method-micro-break",kind:"method",theme:"恢复",title:"让休息短，但真离开屏幕",summary:"微休息不是偷懒，而是把注意力从持续消耗中短暂撤回来。关键是“换一种状态”，不是换一个信息流。",evidence:"Albulescu 等人（2022）的系统综述与元分析发现，工作中的短暂休息对幸福感与表现有小幅正向作用；对高要求任务，恢复性休息更值得保留。",practice:"给自己 5 分钟：起身、看远处、喝水。不要用刷手机换一种注意力消耗。",citation:"Albulescu, P., Macsinga, I., Rusu, A., Sulea, C., Bodnaru, A., & Tulbure, B. T. (2022). “Give me a break!” A systematic review and meta-analysis on the efficacy of micro-breaks for increasing well-being and performance. PLoS ONE, 17(8), e0272460.",sourceUrl:"https://doi.org/10.1371/journal.pone.0272460",sourceLabel:"DOI"},{id:"method-spacing",kind:"method",theme:"专注",title:"把训练摊开，而不是一次用完",summary:"同样的总时长，分几天做，通常比一次猛攻记得更久。",evidence:"Cepeda 等人（2006）整合数百项研究指出，分散练习（distributed practice）在长期保持上通常优于集中练习；间隔长度要与你想记住多久相匹配。",practice:"把今天学的内容拆出 10 分钟，安排到明天和三天后各回顾一次。",citation:"Cepeda, N. J., Pashler, H., Vul, E., Wixted, J. T., & Rohrer, D. (2006). Distributed practice in verbal recall tasks: A review and quantitative synthesis. Psychological Bulletin, 132(3), 354–380.",sourceUrl:"https://doi.org/10.1037/0033-2909.132.3.354",sourceLabel:"DOI"},{id:"method-retrieval",kind:"method",theme:"专注",title:"合上书，先把记得的写出来",summary:"“回想”本身就是学习，比重复阅读更能暴露空白。它当下会有点难，这正是它有用的部分。",evidence:"Roediger 与 Karpicke（2006）发现，提取练习虽然当下感觉更难，却比反复阅读带来更好的长期记忆。",practice:"学完一页，合上材料，用 2 分钟写下三个要点，再翻回去对照。",citation:"Roediger, H. L., & Karpicke, J. D. (2006). Test-enhanced learning: Taking memory tests improves long-term retention. Psychological Science, 17(3), 249–255.",sourceUrl:"https://doi.org/10.1111/j.1467-9280.2006.01693.x",sourceLabel:"DOI"},{id:"method-66-days",kind:"method",theme:"坚持",title:"习惯不是 21 天就能刻好的",summary:"“21 天成习惯”更像流行口号，而不是定律。重复的次数比完美的连续更重要。",evidence:"Lally 等人（2010）追踪日常行为的自动化程度，估计达到习惯平台期的中位数约为 66 天，个体差异很大（约 18–254 天）；偶尔漏一天，并未显著打断形成过程。",practice:"把注意力从“连续打卡”移到“下一次重复”。漏了一天，第二天照常接上。",citation:"Lally, P., van Jaarsveld, C. H. M., Potts, H. W. W., & Wardle, J. (2010). How are habits formed: Modelling habit formation in the real world. European Journal of Social Psychology, 40(6), 998–1009.",sourceUrl:"https://doi.org/10.1002/ejsp.674",sourceLabel:"DOI"},{id:"method-planning-fallacy",kind:"method",theme:"回望",title:"估完时间，再给它留一点风",summary:"人对自己完成任务的速度，普遍过于乐观，即使以前被拖过。计划里没有“意外”，意外就会变成崩溃。",evidence:"Buehler、Griffin 与 Ross（1994）的系列研究表明，人们倾向于低估完成时间，而且往往是在已经知道自己容易拖延的情况下。",practice:"重要事情的估时乘以 1.5；把“意外”当成计划的一部分，而不是失败。",citation:"Buehler, R., Griffin, D., & Ross, M. (1994). Exploring the “planning fallacy”: Why people underestimate their task completion times. Journal of Personality and Social Psychology, 67(3), 366–381.",sourceUrl:"https://doi.org/10.1037/0022-3514.67.3.366",sourceLabel:"DOI"},{id:"method-fresh-start",kind:"method",theme:"启动",title:"借一个「重新开始」的时间地标",summary:"周一、月初、生日，不只是日期，也可能成为换一种做法的心理分界。",evidence:"Dai、Milkman 与 Riis（2014）发现，人们更容易在时间地标之后开始追求目标；他们称之为“fresh start effect”。",practice:"借下一个周一或月初，只改一个具体动作，不必同时重做整个生活。",citation:"Dai, H., Milkman, K. L., & Riis, J. (2014). The fresh start effect: Temporal landmarks motivate aspirational behavior. Management Science, 60(10), 2563–2582.",sourceUrl:"https://doi.org/10.1287/mnsc.2014.1901",sourceLabel:"DOI"},{id:"method-self-compassion",kind:"method",theme:"恢复",title:"搞砸之后，先别补一刀",summary:"自责听起来像在推动自己，但它常常让人更想躲开问题。温和不是放弃要求。",evidence:"Breines 与 Chen（2012）的实验发现，在失败或自我威胁之后，自我关怀能提升改善自己的动机，而不是让人放松要求。",practice:"用“如果是朋友遇到这件事，我会怎么说”写一句，然后只做一个最小补救动作。",citation:"Breines, J. G., & Chen, S. (2012). Self-compassion increases self-improvement motivation. Personality and Social Psychology Bulletin, 38(9), 1133–1143.",sourceUrl:"https://doi.org/10.1177/0146167212445599",sourceLabel:"DOI"},{id:"method-temptation-bundling",kind:"method",theme:"坚持",title:"把喜欢的事，绑在难开始的事上",summary:"让想做的事拥有立即的愉快回报，是降低拖延的一个实用办法。",evidence:"Milkman、Minson 与 Volpp（2014）在健身房做了实地实验：只在锻炼时才能听引人入胜的有声书或小说，能提高出勤。",practice:"选一个只在走路、训练或整理时才能享受的播客或剧集。",citation:"Milkman, K. L., Minson, J. A., & Volpp, K. G. (2014). Holding the Hunger Games hostage at the gym: An evaluation of temptation bundling. Management Science, 60(2), 283–299.",sourceUrl:"https://doi.org/10.1287/mnsc.2013.1784",sourceLabel:"DOI"},{id:"method-goal-gradient",kind:"method",theme:"坚持",title:"越来越近时，人自然会加速",summary:"目标不是只有意义才走；离终点更近的感觉，本身就会推人一把。",evidence:"Kivetz、Urminsky 与 Zheng（2006）在咖啡店会员卡的现场研究中观察到目标梯度：越接近奖励，购买间隔越短，行动越频繁。",practice:"把长期目标拆成看得见的里程碑，并标出已经跨过的那一步。",citation:"Kivetz, R., Urminsky, O., & Zheng, Y. (2006). The goal-gradient hypothesis resurrected: Purchase acceleration, illusionary goal progress, and customer retention. Journal of Marketing Research, 43(1), 39–58.",sourceUrl:"https://doi.org/10.1509/jmkr.43.1.39",sourceLabel:"DOI"},{id:"method-progress-principle",kind:"method",theme:"回望",title:"把今天的一小步记下来",summary:"真正支撑持续投入的，往往不是大喜讯，而是“我今天有进展”。",evidence:"Amabile 与 Kramer 基于数百人的工作日记研究提出“进展原则”：每天的小进展与更积极的情绪、投入感相关。",practice:"睡前写一行：今天推进了什么，很小也算。只记录，不把它变成审判。",citation:"Amabile, T. M., & Kramer, S. J. (2011). The Progress Principle: Using Small Wins to Ignite Joy, Engagement, and Creativity at Work. Harvard Business Review Press.",sourceUrl:"https://hbr.org/2011/05/the-power-of-small-wins",sourceLabel:"HBR"},{id:"method-environment-cue",kind:"method",theme:"专注",title:"让好行为的提示，出现在眼前",summary:"习惯常由场景中的提示自动触发，而不是每次靠意志力重新决定。",evidence:"Neal、Wood 与 Quinn（2006）综述习惯研究指出，重复行为会被稳定的情境线索触发，成为自动化的反应。",practice:"把明天要穿的运动鞋放在门口；把手机放到另一个房间。改提示，比临场硬扛省力。",citation:"Neal, D. T., Wood, W., & Quinn, J. M. (2006). Habits—A repeat performance? Current Directions in Psychological Science, 15(4), 198–202.",sourceUrl:"https://doi.org/10.1111/j.1467-8721.2006.00435.x",sourceLabel:"DOI"}],Vp=[{id:"quote-confucius",kind:"quote",theme:"坚持",title:"乐在其中",body:"知之者不如好之者，好之者不如乐之者。",attribution:"孔子",source:"《论语 · 雍也》",sourceUrl:"https://zh.wikisource.org/wiki/論語/雍也第六"},{id:"quote-laozi",kind:"quote",theme:"启动",title:"从脚下开始",body:"合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。",attribution:"老子",source:"《道德经》第六十四章",sourceUrl:"https://zh.wikisource.org/wiki/道德經"},{id:"quote-su-shi",kind:"quote",theme:"坚持",title:"一蓑烟雨",body:"莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。",attribution:"苏轼",source:"《定风波 · 莫听穿林打叶声》",sourceUrl:"https://zh.wikisource.org/wiki/定風波_(蘇軾)"},{id:"quote-luxun",kind:"quote",theme:"启动",title:"路是走出来的",body:"其实地上本没有路，走的人多了，也便成了路。",attribution:"鲁迅",source:"《故乡》",sourceUrl:"https://zh.wikisource.org/wiki/故鄉"},{id:"quote-tao-yuanming",kind:"quote",theme:"回望",title:"岁月不待人",body:"盛年不重来，一日难再晨。及时当勉励，岁月不待人。",attribution:"陶渊明",source:"《杂诗》其一"},{id:"quote-seneca",kind:"quote",theme:"回望",title:"时间不是太少",body:"并非我们拥有的时间太短，而是我们浪费掉的太多。",attribution:"塞内加",source:"《论生命之短暂》",translated:!0},{id:"quote-marcus-aurelius",kind:"quote",theme:"坚持",title:"障碍成为路",body:"阻碍行动的东西，会推进行动。挡在路上的，也就成了路。",attribution:"马可·奥勒留",source:"《沉思录》第五卷，20 节",translated:!0,sourceUrl:"https://classics.mit.edu/Antoninus/meditations.5.five.html"},{id:"quote-camus",kind:"quote",theme:"恢复",title:"不可战胜的夏天",body:"在隆冬，我终于知道，我身上有一个不可战胜的夏天。",attribution:"阿尔贝·加缪",source:"《重返蒂巴萨》",translated:!0},{id:"quote-rilke",kind:"quote",theme:"恢复",title:"爱问题本身",body:"请对你心中所有未解的问题保持耐心，试着去爱这些问题本身。",attribution:"赖内·马利亚·里尔克",source:"《给青年诗人的信》",translated:!0},{id:"quote-beckett",kind:"quote",theme:"坚持",title:"失败得更好",body:"试过了。失败了。没关系。再试一次。再失败。失败得更好一点。",attribution:"塞缪尔·贝克特",source:"《更糟的是》",translated:!0},{id:"quote-hemingway",kind:"quote",theme:"坚持",title:"不被击败",body:"一个人可以被毁灭，但不能被打败。",attribution:"欧内斯特·海明威",source:"《老人与海》",translated:!0},{id:"quote-dillard",kind:"quote",theme:"回望",title:"日子就是一生",body:"你如何度过你的每一天，当然就是你如何度过你的一生。",attribution:"安妮·迪拉德",source:"《写作生活》",translated:!0},{id:"quote-mary-oliver",kind:"quote",theme:"启动",title:"唯一而珍贵的一生",body:"告诉我，你打算如何度过这唯一、狂野而珍贵的一生？",attribution:"玛丽·奥利弗",source:"《野雁》",translated:!0,sourceUrl:"https://www.poetryfoundation.org/poems/43768/wild-geese"},{id:"quote-james-clear",kind:"quote",theme:"坚持",title:"为一票投票",body:"每一个行动，都是为你想要成为的那个人投下的一票。",attribution:"詹姆斯·克利尔",source:"《原子习惯》",translated:!0,sourceUrl:"ht
